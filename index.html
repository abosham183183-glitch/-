<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعار وزارة الاقتصاد والصناعة - إطار بألوان علم سوريا</title>
    <style>
        body {
            background-color: #0d231a; /* خلفية خضراء داكنة مطابقة للموقع الرسمي */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* الحاوية الرئيسية للشعار والدوائر */
        .logo-wrapper {
            position: relative;
            width: 175px;
            height: 175px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الإطار الدائري الخارجي المتحرك (مصنوع من تدرج ألوان علم سوريا: أحمر، أبيض، أسود، أخضر) */
        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* تدرج مخروطي يجمع ألوان علم سوريا */
            background: conic-gradient(
                from 0deg, 
                #ce1126 0deg,   /* أحمر */
                #ffffff 90deg,  /* أبيض */
                #000000 180deg, /* أسود */
                #007a3d 270deg, /* أخضر */
                #ce1126 360deg
            );
            padding: 3px; /* سمك الإطار */
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotateRing 12s linear infinite; /* حركة دوران مستمرة للإطار */
        }

        /* الدائرة الداخلية الحاضنة للصورة مع التدرج اللوني والظل */
        .inner-circle {
            position: absolute;
            width: 82%;
            height: 82%;
            background: radial-gradient(circle, #16382c 0%, #0f2b20 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* تنسيق حجم الشعار logo7.png */
        .logo-image {
            width: 165px;
            height: auto;
            object-fit: contain;
            animation: slideUpAndGlow 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* حركة دوران الإطار الخارجي بألوان العلم */
        @keyframes rotateRing {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* تأثير الصعود من الأسفل مع توهج ثم الاستقرار في المنتصف */
        @keyframes slideUpAndGlow {
            0% {
                transform: translateY(90px) scale(0.6);
                opacity: 0;
                filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
            }
            50% {
                opacity: 1;
                filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.6)); /* توهج أبيض/ذهبي أثناء الحركة */
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
                filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4)); /* الاستقرار بظل هادئ */
            }
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <!-- الإطار الدائري الخارجي المتحرك بألوان علم سوريا -->
        <div class="outer-ring"></div>
        
        <!-- الدائرة الداخلية مع الشعار وتأثير الصعود -->
        <div class="inner-circle">
            <img src="logo7.png" alt="شعار وزارة الاقتصاد والصناعة" class="logo-image">
        </div>
    </div>

</body>
</html>
