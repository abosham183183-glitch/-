<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  /* حاوية الشريط العلوي */
  .hero-slider {
    position: relative;
    width: 100%;
    height: 350px; /* يمكنك تعديل الارتفاع حسب الرغبة */
    overflow: hidden;
  }

  /* عنصر الصورة */
  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    background-size: cover;
    background-position: center;
  }

  /* تفعيل الصورة الظاهرة */
  .slide.active {
    opacity: 1;
  }

  /* التظليل الأزرق فوق الصور */
  .blue-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 51, 102, 0.5); /* أزرق مع نسبة شفافية 50% */
    z-index: 2;
  }

  /* رابط أو مسار الصور الطبيّة */
  .slide:nth-child(1) { background-image: url('medical1.jpg'); }
  .slide:nth-child(2) { background-image: url('medical2.jpg'); }
  .slide:nth-child(3) { background-image: url('medical3.jpg'); }
  .slide:nth-child(4) { background-image: url('medical4.jpg'); }
  .slide:nth-child(5) { background-image: url('medical5.jpg'); }
</style>
</head>
<body>

<div class="hero-slider">
  <!-- طبقة التظليل الأزرق -->
  <div class="blue-overlay"></div>

  <!-- الصور الخمس -->
  <div class="slide active"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
</div>

<script>
  // كود التبديل التلقائي بين الصور كل 3 ثوانٍ
  let currentSlide = 0;
  const slides = document.querySelectorAll('.slide');
  const totalSlides = slides.length;

  function showNextSlide() {
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % totalSlides;
    slides[currentSlide].classList.add('active');
  }

  setInterval(showNextSlide, 3000); // 3000 مللي ثانية = 3 ثوانٍ
</script>

</body>
</html>
