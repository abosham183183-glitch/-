<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعار وزارة الاقتصاد والصناعة - إطار علم سوريا المتحرك</title>
    <style>
        body {
            background-color: #0d231a; /* خلفية خضراء داكنة مطابقة للموقع الرسمي */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* الحاوية الرئيسية للشعار والدوائر */
        .logo-wrapper {
            position: relative;
            width: 175px;
            height: 175px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الإطار الدائري الخارجي المتحرك (ألوان علم سوريا: أخضر، أبيض، أسود) */
        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg, 
                #007a3d 0deg,   /* أخضر */
                #ffffff 120deg, /* أبيض */
                #000000 240deg, /* أسود */
                #007a3d 360deg
            );
            padding: 2px; /* سمك الإطار */
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotateRing 15s linear infinite; /* حركة دوران مستمرة */
        }

        /* الدائرة الداخلية الحاضنة للصورة مع التدرج اللوني والظل والإطار المتحرك الملاصق */
        .inner-circle {
            position: absolute;
            width: 82%;
            height: 82%;
            background: radial-gradient(circle, #16382c 0%, #0f2b20 100%);
            border-radius: 50%;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            
            /* الإطار الملاصق للشعار (ألوان علم سوريا متحركة) */
            border: 2.5px solid transparent;
            background-image: radial-gradient(circle, #16382c 0%, #0f2b20 100%),
                              conic-gradient(from 0deg, #007a3d, #ffffff, #000000, #007a3d);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            animation: rotateRing 10s linear infinite reverse; /* دوران بعكس الاتجاه لإعطاء حيوية */
        }

        /* تنسيق حجم الشعار logo7.png ليملأ الدوائر المصغرة بدقة */
        .logo-image {
            width: 165px; /* حجم يملأ الدائرة بشكل كامل ومثالي */
            height: auto;
            object-fit: contain;
            animation: slideUpAndGlow 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* حركة دوران الإطارات */
        @keyframes rotateRing {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* تأثير الصعود من الأسفل مع توهج قوي ثم الاستقرار في المنتصف */
        @keyframes slideUpAndGlow {
            0% {
                transform: translateY(90px) scale(0.6);
                opacity: 0;
                filter: drop-shadow(0 0 0px rgba(255, 255, 255, 0));
            }
            50% {
                opacity: 1;
                filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.5)); /* توهج أبيض/أخضر أثناء الحركة */
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
                filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4)); /* الاستقرار بظل هادئ وطبيعي */
            }
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <!-- الإطار الخارجي المتحرك بألوان علم سوريا -->
        <div class="outer-ring"></div>
        
        <!-- الدائرة الداخلية مع الإطار المتحرك الملاصق للشعار وتأثير الصعود -->
        <div class="inner-circle">
            <img src="logo7.png" alt="شعار وزارة الاقتصاد والصناعة" class="logo-image">
        </div>
    </div>

</body>
</html>
