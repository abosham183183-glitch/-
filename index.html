<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الحجز الطبي</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* === الشريط العلوي Slider === */
    .hero-slider {
      position: relative;
      width: 100%;
      height: 380px;
      overflow: hidden;
    }

    /* التظليل الأزرق فوق الصور */
    .blue-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 60, 110, 0.55); /* تظليل أزرق شفاف */
      z-index: 2;
    }

    .slider-text {
      position: absolute;
      top: 50%;
      right: 10%;
      transform: translateY(-50%);
      color: #ffffff;
      z-index: 3;
    }

    .slider-text h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    /* صور الشريط العلوي */
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    .slide.active {
      opacity: 1;
    }

    /* رابط 5 صور طبية */
    .slide:nth-child(1) { background-image: url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1200&q=80'); }
    .slide:nth-child(2) { background-image: url('https://images.unsplash.com/photo-1538108149393-fbbd81895907?auto=format&fit=crop&w=1200&q=80'); }
    .slide:nth-child(3) { background-image: url('https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=1200&q=80'); }
    .slide:nth-child(4) { background-image: url('https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1200&q=80'); }
    .slide:nth-child(5) { background-image: url('https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1200&q=80'); }

    /* === نموذج بيانات الحجز === */
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 25px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0056b3;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #003d80;
    }
  </style>
</head>
<body>

  <!-- الشريط العلوي مع التظليل والـ 5 صور -->
  <div class="hero-slider">
    <div class="blue-overlay"></div>
    <div class="slider-text">
      <h1>العيادة الطبية تخصّصية</h1>
      <p>قم بتعبئة البيانات لإرسال حجزك إلى الطبيب مباشرة</p>
    </div>

    <div class="slide active"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>

  <!-- نموذج الحجز -->
  <div class="container">
    <h2>حجز موعد جديد</h2>
    <form action="send_booking.php" method="POST">
      <div class="form-group">
        <label>اسم المريض الكامل:</label>
        <input type="text" name="patient_name" required placeholder="أدخل اسم المريض">
      </div>
      <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="tel" name="patient_phone" required placeholder="05xxxxxxxx">
      </div>
      <div class="form-group">
        <label>تاريخ وتوقيت الحجز:</label>
        <input type="datetime-local" name="booking_date" required>
      </div>
      <div class="form-group">
        <label>الفرع / القسم الطبي:</label>
        <input type="text" name="department" required placeholder="مثال: عيادة الأسنان / العظام">
      </div>
      <div class="form-group">
        <label>ملاحظات أو حالة المريض (اختياري):</label>
        <textarea name="notes" rows="3" placeholder="أكتب أي ملاحظات إضافية..."></textarea>
      </div>
      <button type="submit" class="btn-submit">تأكيد الحجز وإرسال الـ PDF للطبيب</button>
    </form>
  </div>

  <script>
    // التنقل التلقائي بين الصور كل 3.5 ثوانٍ
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;

    function showNextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % totalSlides;
      slides[currentSlide].classList.add('active');
    }

    setInterval(showNextSlide, 3500);
  </script>
</body>
</html>
