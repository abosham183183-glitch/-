<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعار وزارة الاقتصاد والصناعة - تأثير الظهور والتوهج</title>
    <style>
        body {
            background-color: #0d231a; /* خلفية خضراء داكنة مطابقة للموقع الرسمي */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        /* الحاوية الرئيسية للشعار والدوائر */
        .logo-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الإطار الدائري الخارجي المنقوش */
        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(212, 175, 55, 0.4);
            border-radius: 50%;
            animation: rotateRing 20s linear infinite;
        }

        /* الدائرة الداخلية الحاضنة للصورة مع التدرج اللوني والظل */
        .inner-circle {
            position: absolute;
            width: 86%;
            height: 86%;
            background: radial-gradient(circle, #16382c 0%, #0f2b20 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* تنسيق وتكبير صورة الشعار logo7.png وتطبيق تأثير الصعود والتوهج والاستقرار */
        .logo-image {
            width: 195px; /* حجم أكبر يملأ الدائرة بشكل ممتاز */
            height: auto;
            object-fit: contain;
            animation: slideUpAndGlow 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* حركة دوران الإطار الخارجي */
        @keyframes rotateRing {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* تأثير الصعود من الأسفل مع توهج قوي ثم الاستقرار في المنتصف */
        @keyframes slideUpAndGlow {
            0% {
                transform: translateY(100px) scale(0.6);
                opacity: 0;
                filter: drop-shadow(0 0 0px rgba(212, 175, 55, 0));
            }
            50% {
                opacity: 1;
                filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.9)); /* توهج ذهبي ساطع أثناء الحركة */
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
                filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4)); /* الاستقرار بظل هادئ وطبيعي */
            }
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <!-- الإطار الدائري الخارجي المتحرك -->
        <div class="outer-ring"></div>
        
        <!-- الدائرة الداخلية مع الشعار بحجم أكبر وتأثير التوهج -->
        <div class="inner-circle">
            <img src="logo7.png" alt="شعار وزارة الاقتصاد والصناعة" class="logo-image">
        </div>
    </div>

</body>
</html>
