<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعار وزارة الاقتصاد والصناعة</title>
    <style>
        body {
            background-color: #0d231a; /* خلفية خضراء داكنة مطابقة للموقع الرسمي */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* الحاوية الرئيسية للشعار والدوائر */
        .logo-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* الإطار الدائري الخارجي المنقوش */
        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(212, 175, 55, 0.4);
            border-radius: 50%;
            animation: rotateRing 20s linear infinite;
        }

        /* الدائرة الداخلية الحاضنة للصورة مع التدرج اللوني والظل */
        .inner-circle {
            position: absolute;
            width: 85%;
            height: 85%;
            background: radial-gradient(circle, #16382c 0%, #0f2b20 100%);
            border: 1.5px solid rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* تنسيق صورة الشعار المرفوعة */
        .logo-image {
            width: 120px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* حركة دوران خفيفة للإطار الخارجي */
        @keyframes rotateRing {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <!-- الإطار الدائري الخارجي -->
        <div class="outer-ring"></div>
        
        <!-- الدائرة الداخلية مع صورة الشعار المرفوعة -->
        <div class="inner-circle">
            <img src="logo7.png" alt="شعار وزارة الاقتصاد والصناعة" class="logo-image">
        </div>
    </div>

</body>
</html>
